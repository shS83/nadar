# NADAR - Network Anomaly Detection and Reporting v0.6.0
# Example configuration; editing this file does not automatically restart
# the running nadar.service (use systemctl --user restart nadar.service).

LISTENPROTO="TCP,UDP"
EXCLUDEPORTS=""
EXCLUDE_PROCESSES=""
EXCLUDE_PIDS=""
# Suppress notifications for these process names; keep them in reports.
EXCLUDE_PROCESS_NOTIFY="spotify"
NADAR_INTERVAL=10

# Remote health check. The responder on this host returns OK to PING.
REMOTE_POKE_HOST="prometheus-alexander.fi"
REMOTE_POKE_PORT=42000

# Existing SSH Host alias from ~/.ssh/config, or a remote DNS hostname.
REMOTE_SSH_HOST="ouroboros"
# Empty means discover your IPv4 using https://ifconfig.co/ip.
REMOTE_SCAN_TARGET=""

# --scan and --remote-verify use the root-owned nadar-scan helper on REMOTE_SSH_HOST.
